<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend Mentor | NFT preview card component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="stylesheet" href="./styles.css" />
</head>

<body>
    <article class="card">
        <div class="card-image-wrap">
            <img src="/images/image-equilibrium.jpg" alt="" class="card-image" />
            <div class="card-image-view-wrap">
                <img src="/images/icon-view.svg" class="card-image-view" />
            </div>
        </div>
        <section class="card-content">
            <h2><a href="#">Equilibrium #3429</a></h2>
            <p>Our Equilibrium collection promotes balance and calm.</p>
            <div>
                <span class="price">
                    <img src="images/icon-ethereum.svg" />
                    <span>0.041 ETH</span>
                </span>
                <span class="time">
                    <img src="images/icon-clock.svg" />
                    <span>3 days left</span>
                </span>
            </div>
        </section>
        <footer class="card-footer">
            <div class="line"></div>
            <div class="footer-content">
                <img src="images/image-avatar.png" alt="avatar" />
                <p>Creation of <a href="#">Jules Wyvern</a></p>
            </div>
        </footer>
    </article>
</body>

</html>
